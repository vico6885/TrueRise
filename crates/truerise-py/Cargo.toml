[package]
name = "truerise-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "PyO3 native backend for the truerise Python package: chain append/verify, fingerprints, ratchet - the same crates, importable."
keywords = ["pyo3", "python", "bindings", "audit-chain"]
categories = ["development-tools", "api-bindings"]
publish = false

[lib]
name = "truerise_native"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
pyo3 = { version = "0.23.5", default-features = false, features = ["extension-module", "abi3-py310", "macros"] }
truerise-governance = { version = "0.2.0-dev.0", path = "../truerise-governance" }
truerise-eval = { version = "0.2.0-dev.0", path = "../truerise-eval" }
truerise-wire = { version = "0.2.0-dev.0", path = "../truerise-wire" }
serde_json = "1.0.154"
