[package]
name = "truerise-observe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Audit events to spans: jsonl (default) and OTLP exporter behind the otel feature; one-way, no re-ingestion."
keywords = ["observability", "spans", "redaction", "audit", "export"]
categories = ["development-tools", "development-tools::debugging"]
publish = false

[lints]
workspace = true

[dependencies]
serde_json = "1.0.154"
sha2 = "0.11.0"

[features]
# The OTLP SDK tier lands behind this feature (jsonl stays default); declared
# so `cfg(feature = "otel")` is a known value to the compiler/CI lints.
otel = []
