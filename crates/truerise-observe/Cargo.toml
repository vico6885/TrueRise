[package]
name = "truerise-observe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Audit events to spans: jsonl (default) and OTLP exporter behind the otel feature; one-way, no re-ingestion."
keywords = ["observability", "spans", "redaction", "audit", "export"]
categories = ["development-tools", "development-tools::debugging"]
publish = false

[lints]
workspace = true

[dependencies]
opentelemetry = { version = "0.27", optional = true }
opentelemetry_sdk = { version = "0.27", optional = true, features = ["trace"] }
opentelemetry-stdout = { version = "0.27", optional = true, features = ["trace"] }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["fast", "std"] }
serde_json = "1.0.154"
sha2 = "0.11.0"

[features]
# The OTLP SDK tier lands behind this feature (jsonl stays default); declared
# The OTLP tier: the audit rows become REAL OpenTelemetry spans. The
# stdout exporter ships in the feature (deterministic, test-friendly); a
# collector endpoint is wired at the boundary with one line (see
# docs/integrations.md) - the mapping layer is exporter-agnostic.
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-stdout"]
