[package]
name = "truerise-hats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Hat schema + TOML loader (hats are data, not traits) + preset hat data packs."
keywords = ["configuration", "roles", "toml", "agent", "prompt"]
categories = ["config"]
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.1"
sha2 = "0.11.0"
truerise-wire = { version = "0.2.0-dev.0", path = "../truerise-wire" }
truerise-governance = { version = "0.2.0-dev.0", path = "../truerise-governance" }

[dev-dependencies]
tempfile = "3.27.0"
