[package]
name = "truerise-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Single-binary entry: REPL / run / demo / onboarding wizard (binary target lands in M5)."
keywords = ["cli", "repl", "demo", "evaluation", "onboarding"]
categories = ["command-line-utilities", "development-tools::testing"]
publish = false

[lints]
workspace = true

[dependencies]
truerise-wire = { version = "0.2.0-dev.0", path = "../truerise-wire" }
truerise-core = { version = "0.2.0-dev.0", path = "../truerise-core" }
truerise-governance = { version = "0.2.0-dev.0", path = "../truerise-governance" }
truerise-sandbox = { version = "0.2.0-dev.0", path = "../truerise-sandbox" }
truerise-rsi = { version = "0.2.0-dev.0", path = "../truerise-rsi" }
truerise-eval = { version = "0.2.0-dev.0", path = "../truerise-eval" }
truerise-hats = { version = "0.2.0-dev.0", path = "../truerise-hats" }
truerise-memory = { version = "0.2.0-dev.0", path = "../truerise-memory" }
truerise-observe = { version = "0.2.0-dev.0", path = "../truerise-observe" }
truerise-mcp = { version = "0.2.0-dev.0", path = "../truerise-mcp" }
sha2 = "0.11.0"
toml = "1.2.1"
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["fast", "std"] }
serde_json = "1.0.154"
ureq = { version = "2.10.1", default-features = false, features = ["json", "tls", "gzip"] }

[[bin]]
name = "truerise"
path = "src/main.rs"
