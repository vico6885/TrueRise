# cargo-deny configuration - supply-chain and license isolation.

[graph]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
# Isolation assertion: the legacy Python-edition license BSL-1.1 is
# deliberately NOT in the allow list above (and never may be), together with
# GPL/AGPL copyleft. A comment is not a check - this invariant is
# machine-asserted in CI by tools/lint_deny_isolation.py.

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
version = 2
yanked = "warn"
# Single, narrowly scoped exception. chrono 0.4.x is flagged `unmaintained`
# (RUSTSEC-2026-0543); upstream states no safe upgrade is available because all
# published versions are affected. Our only incoming edge is the optional
# `otel` tier via opentelemetry-stdout 0.27, whose every released version
# hard-depends on chrono for span-timestamp formatting. The advisory is a
# maintenance-status notice, not an exploitable vulnerability. Do NOT add
# other ids here without an equivalent written rationale.
# Revisit this exception when any of the following becomes true:
#   1. opentelemetry-stdout ships a chrono-free release (pin it and drop this);
#   2. the advisory is upgraded to a concrete, exploitable vulnerability;
#   3. the otel tier switches to a different exporter with no chrono edge.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained with no upstream fix; sole edge is optional otel via opentelemetry-stdout 0.27, which hard-depends on chrono in all published versions. Maintenance-status advisory, not an exploitable flaw. Re-evaluate on a chrono-free opentelemetry-stdout release, an exploitable advisory upgrade, or an exporter replacement." },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
