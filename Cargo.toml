[workspace]
resolver = "2"
members = [
    "crates/truerise-core",
    "crates/truerise-wire",
    "crates/truerise-platform",
    "crates/truerise-governance",
    "crates/truerise-sandbox",
    "crates/truerise-eval",
    "crates/truerise-memory",
    "crates/truerise-rsi",
    "crates/truerise-hats",
    "crates/truerise-mcp",
    "crates/truerise-observe",
    "crates/truerise-cli",
    "crates/truerise-py",
]

[workspace.package]
version = "0.2.0-dev.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
authors = ["The TrueRise Authors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
non_ascii_idents = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
strip = true
lto = true
codegen-units = 1

# cargo-dist configuration (spec §6.5): the five-platform matrix ships with the
# first public tag (release.yml invokes `cargo dist build`); CI job runs on PRs
# to keep the config exercised.
[workspace.metadata.dist]
cargo-dist-version = "0.28.0"
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
installers = ["shell", "powershell"]
ci = ["github"]
