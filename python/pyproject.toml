[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "truerise"
version = "0.2.0.dev0"
description = "TrueRise integrity-evaluation layer: claim ledger, prereg gate, evidence gate - the 60-second demo."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0 OR MIT" }
authors = [{ name = "The TrueRise Authors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
truerise = "truerise.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/truerise"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
