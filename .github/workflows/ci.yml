name: ci

on:
  push:
  pull_request:

jobs:
  fmt-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml and provisions the pinned toolchain.
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.85 --profile minimal
      - run: cargo +1.85 check --workspace --all-targets

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-deny@0.20.2 --locked
      - run: cargo deny check
      - run: python3 tools/lint_deny_isolation.py

  leak-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: workspace door (= naming gate)
        run: python3 tools/lint_banned_words.py
      - name: history-object door
        run: python3 tools/lint_git_history.py
      - name: file-length gate (<= 600 lines)
        run: python3 tools/lint_file_length.py

  governance-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/lint_schemas.py
      - run: python3 tools/lint_spec_map.py
      - run: python3 tools/check_leakguard_skeleton.py
      - run: python3 tools/lint_dco.py

  timesafety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "timesafety: four vectors ENFORCED since M1 (declaration + enforcing tests asserted; never skippable)"
        run: python3 tools/check_leakguard_skeleton.py

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo bench --workspace -- --save-baseline main
      # 20% regression comparison activates once the `main` baseline exists
      # (first default-branch run saves it; later runs compare with critcmp).
      - name: baseline-backed regression check
        run: |
          if [ -d target/criterion ]; then
            cargo install critcmp --locked
            critcmp main main --threshold 20 || exit 1
          else
            echo "no saved baseline yet - this run SAVED one (compare activates next run)"
          fi

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-cyclonedx@0.5.10 --locked
      - run: cargo cyclonedx --format json --spec-version 1.5
      - run: python3 tools/check_sbom.py
