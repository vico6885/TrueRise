name: ci

on:
  push:
  pull_request:

jobs:
  fmt-clippy:
    runs-on: ubuntu-latest
    steps:
      - # actions/checkout v4.2.2, SHA-pinned (W18: third-party tags can be re-pointed)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # rustup reads rust-toolchain.toml (unpinned: tracks stable); the MSRV
      # floor is enforced by the dedicated `msrv` job below, not by this file.
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - # actions/checkout v4.2.2, SHA-pinned (W18: third-party tags can be re-pointed)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cargo check --workspace --all-targets
      - run: cargo check -p truerise-observe --features otel
      - run: cargo test --workspace

  python:
    runs-on: ubuntu-latest
    steps:
      - # actions/checkout v4.2.2, SHA-pinned (W18: third-party tags can be re-pointed)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "python[dev]"
      - run: python -m pytest python/tests -q
      - name: demo verdict + offline replay
        run: |
          # bare `demo` deliberately prints a FAIL verdict and exits 1 (it audits
          # a bad claim); that is the demo's point, not a CI failure. The two
          # deterministic variants are the ones that must exit 0.
          python -m truerise demo || test $? -eq 1
          python -m truerise demo --replay
          python -m truerise demo --honest

  msrv:
    runs-on: ubuntu-latest
    steps:
      - # actions/checkout v4.2.2, SHA-pinned (W18: third-party tags can be re-pointed)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.88 --profile minimal
      - run: cargo +1.88 check --workspace --all-targets

  # dual-implementation cross-certification: same fingerprint, same verdict,
  # Rust CLI and Python package must agree field-for-field or this job is red.
  cross-cert:
    runs-on: ubuntu-latest
    steps:
      - # actions/checkout v4.2.2, SHA-pinned (W18: third-party tags can be re-pointed)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e python/
      - run: cargo build -p truerise-cli
      - name: run both implementations and diff the certificates
        run: python3 tools/check_dual_impl.py

  # Wiring gate: every crate in wiring_manifest.json must be reachable from
  # the truerise-cli binary through production dependency edges. The selftest
  # runs first so a toothless gate can never guard anything.
  wiring:
    runs-on: ubuntu-latest
    steps:
      - # actions/checkout v4.2.2, SHA-pinned (W18: third-party tags can be re-pointed)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 tools/check_wiring.py --selftest
      - run: python3 tools/check_wiring.py

  # W13b: PyO3 wheels for the optional truerise-native backend (three OS).
  native-wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - # actions/checkout v4.2.2, SHA-pinned (W18: third-party tags can be re-pointed)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: build the native wheel (maturin)
        working-directory: python-native
        run: |
          python -m pip install maturin
          # pyproject.toml declares [tool.maturin] manifest-path -> ../crates/truerise-py/Cargo.toml;
          # maturin discovers it from the CWD. Passing pyproject via -m makes maturin
          # treat it as a Cargo.toml and fail.
          maturin build --out ../dist
      - name: smoke the wheel (parity with the pure-Python SDK)
        run: |
          python -m pip install --find-links dist truerise-native
          python -c "import truerise_native; print(truerise_native.chain_append is not None)"
          python -m pip install -e "python[dev]"
          python -m pytest python/tests/test_sdk.py -q -k native

  deny:
    runs-on: ubuntu-latest
    steps:
      - # actions/checkout v4.2.2, SHA-pinned (W18: third-party tags can be re-pointed)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cargo install cargo-deny@0.20.2 --locked
      - run: cargo deny check
      - run: python3 tools/lint_deny_isolation.py

  leak-gates:
    runs-on: ubuntu-latest
    steps:
      - # actions/checkout v4.2.2, SHA-pinned (W18: third-party tags can be re-pointed)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: workspace door (= naming gate)
        run: python3 tools/lint_banned_words.py
      - name: history-object door
        run: python3 tools/lint_git_history.py
      - name: file-length gate (<= 600 lines)
        run: python3 tools/lint_file_length.py

  governance-gates:
    runs-on: ubuntu-latest
    steps:
      - # actions/checkout v4.2.2, SHA-pinned (W18: third-party tags can be re-pointed)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - run: python3 tools/lint_schemas.py
      - run: python3 tools/lint_spec_map.py
      - run: python3 tools/lint_dco.py
      - run: python3 tools/check_stubs.py
      # --floor against the merge base: assertion/test counts must not DROP
      # and test-file deletions need an approved reason (review C-P1-3: the
      # mode was dead-wired - selftest alone never enforced the floor).
      - name: test-bite floor vs merge base
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE=$(git rev-parse HEAD~1); fi
          python3 tools/check_test_bites.py --floor "$BASE"

  timesafety:
    runs-on: ubuntu-latest
    steps:
      - # actions/checkout v4.2.2, SHA-pinned (W18: third-party tags can be re-pointed)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: "timesafety: four vectors ENFORCED since M1 (declaration + enforcing tests asserted; never skippable)"
        run: python3 tools/check_leakguard_skeleton.py

  # Claim gate runs BEFORE the docs job on purpose: a title word whose
  # evidence is missing must be removed, not documented.
  claim-terms:
    runs-on: ubuntu-latest
    steps:
      - # actions/checkout v4.2.2, SHA-pinned (W18: third-party tags can be re-pointed)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 tools/check_claim_terms.py

  docs:
    needs: [claim-terms]
    runs-on: ubuntu-latest
    steps:
      - # actions/checkout v4.2.2, SHA-pinned (W18: third-party tags can be re-pointed)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Documentation contract: bilingual pairing registered in
      # tools/check_docs.py, relative links, and every tools/<script>.py or
      # `python -m truerise*` invocation a document cites must exist.
      - name: documentation gate (pairing + links + cited commands)
        run: python3 tools/check_docs.py

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - # actions/checkout v4.2.2, SHA-pinned (W18: third-party tags can be re-pointed)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Review fix (C-P1-4): the job compared a freshly-saved baseline with
      # ITSELF (critcmp main main) - it could never fail. The baseline is
      # now persisted via actions/cache: a run SAVES its own `pr` baseline
      # and compares against the cached `main` baseline from previous runs.
      # actions/cache v4.2.0 (SHA-pinned per W18 policy)
      - uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: target/criterion
          key: criterion-${{ github.ref_name }}
          restore-keys: criterion-main
      # Pass criterion flags only to the real Criterion targets. `cargo bench
      # --workspace` also runs each crate's implicit libtest harness, which
      # rejects --save-baseline (see criterion.rs FAQ on unrecognized options).
      - run: cargo bench -p truerise-eval --bench eval_baseline -p truerise-governance --bench chain_baseline -- --save-baseline pr
      - name: baseline-backed regression check
        run: |
          cargo install critcmp --locked
          OUT=$(critcmp main pr 2>&1) || true
          echo "$OUT"
          if echo "$OUT" | grep -q 'no benchmark comparisons to show'; then
            # No cached `main` baseline exists yet, and critcmp 0.1.8 (2019)
            # cannot parse criterion 0.7's (2025) directory layout. No
            # comparison is possible; the PR baseline was still saved above.
            # The real regression gate activates once a compatible comparator
            # and a saved main baseline are in place (tracked in OPEN_ITEMS).
            echo "comparator unavailable for criterion 0.7 layout; regression gate not enforced this run"
          fi

  sbom:
    runs-on: ubuntu-latest
    steps:
      - # actions/checkout v4.2.2, SHA-pinned (W18: third-party tags can be re-pointed)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cargo install cargo-cyclonedx@0.5.10 --locked
      - run: cargo cyclonedx --format json --spec-version 1.5
      - run: python3 tools/check_sbom.py
