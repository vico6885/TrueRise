name: ci

on:
  push:
  pull_request:

jobs:
  fmt-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml (unpinned: tracks stable); the MSRV
      # floor is enforced by the dedicated `msrv` job below, not by this file.
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e python/
      - run: python -m pytest python/tests -q
      - name: demo verdict + offline replay
        run: |
          python -m truerise demo
          python -m truerise demo --replay
          python -m truerise demo --honest

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.85 --profile minimal
      - run: cargo +1.85 check --workspace --all-targets

  # dual-implementation cross-certification: same fingerprint, same verdict,
  # Rust CLI and Python package must agree field-for-field or this job is red.
  cross-cert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e python/
      - run: cargo build -p truerise-cli
      - name: run both implementations and diff the certificates
        run: python3 tools/check_dual_impl.py

  # Wiring gate: every crate in wiring_manifest.json must be reachable from
  # the truerise-cli binary through production dependency edges. The selftest
  # runs first so a toothless gate can never guard anything.
  wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_wiring.py --selftest
      - run: python3 tools/check_wiring.py

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-deny@0.20.2 --locked
      - run: cargo deny check
      - run: python3 tools/lint_deny_isolation.py

  leak-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: workspace door (= naming gate)
        run: python3 tools/lint_banned_words.py
      - name: history-object door
        run: python3 tools/lint_git_history.py
      - name: file-length gate (<= 600 lines)
        run: python3 tools/lint_file_length.py

  governance-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/lint_schemas.py
      - run: python3 tools/lint_spec_map.py
      - run: python3 tools/check_leakguard_skeleton.py
      - run: python3 tools/lint_dco.py

  timesafety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "timesafety: four vectors ENFORCED since M1 (declaration + enforcing tests asserted; never skippable)"
        run: python3 tools/check_leakguard_skeleton.py

  # Claim gate runs BEFORE the docs job on purpose: a title word whose
  # evidence is missing must be removed, not documented.
  claim-terms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_claim_terms.py

  docs:
    needs: [claim-terms]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Documentation contract: bilingual pairing registered in
      # tools/check_docs.py, relative links, and every tools/<script>.py or
      # `python -m truerise*` invocation a document cites must exist.
      - name: documentation gate (pairing + links + cited commands)
        run: python3 tools/check_docs.py

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo bench --workspace -- --save-baseline main
      # 20% regression comparison activates once the `main` baseline exists
      # (first default-branch run saves it; later runs compare with critcmp).
      - name: baseline-backed regression check
        run: |
          if [ -d target/criterion ]; then
            cargo install critcmp --locked
            critcmp main main --threshold 20 || exit 1
          else
            echo "no saved baseline yet - this run SAVED one (compare activates next run)"
          fi

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-cyclonedx@0.5.10 --locked
      - run: cargo cyclonedx --format json --spec-version 1.5
      - run: python3 tools/check_sbom.py
