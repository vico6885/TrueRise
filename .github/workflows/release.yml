# cargo-dist release pipeline (placeholder until the first public release;
# the five-platform matrix + SHA256 + installer scripts land with that release,
# per spec §6.5). Kept in-repo so the release surface is reviewable from M5.
name: release
on:
  push:
    tags: ["v*"]

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - # actions/checkout v4.2.2, SHA-pinned (W18: third-party tags can be re-pointed)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cargo install cargo-dist --locked
      - run: cargo dist build --output-format=json > dist.json
      - name: assert artifacts exist
        run: python3 -c "import json,sys; d=json.load(open('dist.json')); assert d.get('artifacts'), 'no artifacts'"
